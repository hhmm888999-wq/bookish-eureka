<body>
<title>يانا كاشير</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — slim brand bar with view tabs; POS = product wall + order ticket (left, RTL end); kitchen = ticket rail; menu/reports = working sheets */
:root{
  --bg:#f3f4f0; --surface:#ffffff; --sunk:#e9ebe5; --line:#d9ddd3;
  --ink:#1c241e; --muted:#5f6b62; --brand:#243c29; --brand-ink:#ffffff; --brand-soft:#dfe8df;
  --crust:#a8652c; --crust-soft:#f4e6d6;
  --good:#2f7d46; --warn:#b7791f; --bad:#b33a2e; --good-soft:#e1f0e5; --warn-soft:#f8ecd3; --bad-soft:#f6dedb;
  --f-display:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#192019; --sunk:#222b23; --line:#2f3a31;
  --ink:#e8ede7; --muted:#9aa89d; --brand:#9cc7a3; --brand-ink:#0f1a11; --brand-soft:#243327;
  --crust:#e2a568; --crust-soft:#3a2a1b;
  --good:#6cc189; --warn:#e3b45a; --bad:#ec8378; --good-soft:#1d3324; --warn-soft:#3a2f17; --bad-soft:#3d2220;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#192019; --sunk:#222b23; --line:#2f3a31;
  --ink:#e8ede7; --muted:#9aa89d; --brand:#9cc7a3; --brand-ink:#0f1a11; --brand-soft:#243327;
  --crust:#e2a568; --crust-soft:#3a2a1b;
  --good:#6cc189; --warn:#e3b45a; --bad:#ec8378; --good-soft:#1d3324; --warn-soft:#3a2f17; --bad-soft:#3d2220;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--crust);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--brand)}
.bar{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.5px;line-height:1}
.logo small{font:500 11px var(--f-body);opacity:.75;display:block;letter-spacing:1.5px;margin-top:4px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-inline-start:auto}
nav a{color:inherit;text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;opacity:.8;display:flex;gap:6px;align-items:center}
nav a[aria-current="page"]{background:var(--brand-ink);color:var(--brand);opacity:1}
nav a .pill.green{background:#2f7d46}
nav a .pill{background:var(--crust);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
.demo-tag{font-size:11px;border:1px solid currentColor;border-radius:999px;padding:2px 8px;opacity:.75}

main{padding-block:16px 96px}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.prod{position:relative;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-height:104px;transition:transform .08s,border-color .15s}
.prod:hover{border-color:var(--brand)}
.prod:active{transform:scale(.98)}
.prod b{font-weight:600;font-size:14.5px;line-height:1.35}
.prod .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.prod .price{color:var(--crust);font-weight:700}
.prod .kcal{font-size:11.5px;color:var(--muted)}
.prod .stn{position:absolute;top:8px;left:30px;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.prod .stk{font-size:11.5px;color:var(--muted)}
.prod .stk.low{color:var(--bad);font-weight:600}
.prod[disabled]{opacity:.45;cursor:not-allowed}
.prod{padding-bottom:12px;padding-top:20px;overflow:hidden}
.prod .soldout{align-self:flex-start;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--bad-soft);color:var(--bad)}
.prod .half{position:absolute;top:0;bottom:0;width:22px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;pointer-events:none}
.prod .half.add{right:0;background:var(--good-soft);color:var(--good)}
.prod .half.rm{left:0;background:var(--sunk);color:var(--muted);opacity:.55}
.prod.has .half.rm{background:var(--bad-soft);color:var(--bad);opacity:1}
.prod{padding-left:30px;padding-right:30px}
.prod.has{border-color:var(--crust)}
.prod .inq{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:var(--crust);color:#fff;border-radius:0 0 8px 8px;padding:0 10px;font-size:12px;font-weight:700}
.catgrid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.ctile{text-align:start;background:var(--brand-soft);border:1px solid transparent;border-radius:14px;padding:16px;min-height:120px;display:flex;flex-direction:column;gap:6px;transition:transform .08s,border-color .15s}
.ctile:hover{border-color:var(--brand)}
.ctile:active{transform:scale(.98)}
.ctile b{font-family:var(--f-display);font-size:19px;color:var(--brand);line-height:1.25}
.c-meta{display:flex;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.c-out{color:var(--bad);font-weight:600}
.c-price{margin-top:auto;font-weight:700;color:var(--crust);font-size:14px}
.cathead{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:2px}
.cathead h2{margin:0;font-size:20px}
.prod[disabled] .stn{background:var(--bad-soft);color:var(--bad)}

.ticket{position:sticky;top:76px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
.t-head{padding:14px 16px 10px;border-bottom:1px dashed var(--line)}
.t-head h3{margin:0 0 10px;font-family:var(--f-display);font-size:18px;display:flex;justify-content:space-between}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 4px;font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:700}
.tbl{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13.5px;color:var(--muted)}
.startp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.st-main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.st-big{text-align:start;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:22px 18px;display:grid;gap:4px}
.st-big:hover{border-color:var(--brand)}
.st-big b{font-size:24px;color:var(--brand)}
.st-big span{font-size:13.5px;color:var(--muted)}
.st-apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.st-apps button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:16px 8px;font-size:16px;font-weight:700;color:var(--crust)}
.st-apps button:hover{border-color:var(--crust);background:var(--crust-soft)}
.st-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.st-head h2{margin:0}
.st-tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.st-tables button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:16px 0;font-size:20px;font-weight:700}
.st-tables button:hover,.st-tables button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.typebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tb-lbl{font-weight:700;font-size:15px;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:6px 14px}
.t-type{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:10px 12px;font-weight:700;font-size:16px}
.t-type button{border:1px solid var(--brand);background:var(--surface);color:var(--brand);border-radius:999px;padding:4px 14px;font-weight:600;font-size:13px}
.ticket.dim .t-foot{opacity:.6}
@media (max-width:520px){.st-apps{grid-template-columns:repeat(2,minmax(0,1fr))}.st-big{padding:16px 14px}.st-big b{font-size:20px}}
.t-scroll{flex:1;overflow:auto;min-height:0}
.t-title{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px}
.t-title h3{margin:0;font-size:20px;font-weight:700}
.t-title h3 .num{color:var(--muted);font-size:15px;font-weight:600}
.t-count{background:var(--crust);color:#fff;border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.t-sec{padding:8px 16px 14px}
.t-sec+.t-sec{border-top:6px solid var(--sunk)}
.sec-h{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin:4px 0 8px}
.lines2{display:grid;gap:8px}
.line2{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;background:var(--bg)}
.l-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline}
.l-q{font-size:20px;font-weight:700;color:var(--crust);min-width:32px}
.l-name{font-size:16.5px;font-weight:700;line-height:1.35}
.l-price{font-size:15px;font-weight:700}
.l-mods{font-size:13.5px;color:var(--muted);padding-inline-start:42px}
.line2 .ln-show{padding-inline-start:42px;font-size:13.5px}
.line2 .qty{margin-top:6px}
.line2 .qty button{width:36px;height:36px;font-size:18px}
.line2 .qty>.num{min-width:22px;text-align:center;font-weight:700;font-size:16px}
.line2 .qty .addnote,.line2 .qty .rm{width:auto;height:auto;font-size:13px}
.t-where{background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px}
.warn-t{color:var(--warn)}
.t-foot .row:not(.total){font-size:12.5px}
.t-foot .row.total{font-size:24px;margin-top:0}
.seg.two{grid-template-columns:repeat(2,1fr)}
.sublabel{font-size:12px;color:var(--muted);margin:10px 0 6px;font-weight:600;letter-spacing:.2px}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.apps button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 4px;font-size:13px;font-weight:500}
.apps button[aria-pressed="true"]{border-color:var(--crust);background:var(--crust-soft);color:var(--crust);font-weight:700}
.tables{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:132px;overflow:auto}
.tables button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 0;font-weight:600}
.tables button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hint{margin:0;font-size:13px;color:var(--warn);font-weight:600}
a.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.tbl input#appno{width:auto;flex:1;min-width:0}
.tbl input{width:80px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg)}
.lines{overflow:auto;padding:6px 16px;flex:1;min-height:80px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--sunk)}
.line .nm{font-weight:600;font-size:14px}
.line .md{grid-column:1;font-size:12px;color:var(--muted)}
.line .lp{text-align:end;font-weight:600}
.qty{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;line-height:1}
.qty .addnote{width:auto;padding:0 10px;font-size:12px;font-weight:500;color:var(--brand);border-color:transparent;background:none;margin-inline-start:auto}
.qty .addnote+.rm{margin-inline-start:0}
.lnote{grid-column:1/-1;display:flex;gap:6px;margin-top:4px}
.lnote input{flex:1;min-width:0;border:1px solid var(--brand);border-radius:8px;padding:6px 8px;background:var(--bg);font-size:14px}
.noteok{border:0;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:0 12px;font-weight:600;font-size:13px}
.ln-show{grid-column:1/-1;font-size:12.5px;color:var(--crust);font-weight:600}
.rv-note{color:var(--crust)!important;font-weight:600}
.kn{display:block;font-style:normal;font-size:13px;font-weight:700;color:var(--crust);background:var(--crust-soft);border-radius:6px;padding:2px 8px;margin-top:3px}
.qty .rm{margin-inline-start:auto;width:auto;padding:0 10px;font-size:12px;font-weight:500;color:var(--bad);border-color:transparent;background:none}
.empty{color:var(--muted);text-align:center;padding:28px 8px;font-size:14px}
.t-foot{padding:12px 16px 16px;border-top:1px dashed var(--line);display:grid;gap:6px}
.row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.row.total{font-size:20px;color:var(--ink);font-weight:700;margin-top:4px}
.btn{border:0;border-radius:var(--r);padding:12px 16px;font-weight:700;font-size:15px;background:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.crust{background:var(--crust);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.cartbar{display:none}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,11,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(520px,100%);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;padding:22px}}
.sheet h3{margin:0;font-family:var(--f-display);font-size:20px}
.sheet-top{display:flex;margin:-4px 0 10px}
.backbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.backbtn:hover{border-color:var(--brand)}
.backbtn span{font-size:16px;line-height:1}
.grp{margin-top:16px}
.review h3{font-size:19px}
.rv-where{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand-soft);border-radius:var(--r);padding:12px 14px}
.rv-where b{font-size:18px;color:var(--brand)}
.rv-where.app{background:var(--crust-soft)}
.rv-where.app b{color:var(--crust)}
.rv-where>span{font-size:13.5px;color:var(--muted)}
.rv-lines{list-style:none;margin:12px 0 0;padding:0}
.rv-lines li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px dashed var(--line)}
.rv-q{font-size:20px;font-weight:700;color:var(--crust);min-width:34px}
.rv-n b{font-size:16.5px;display:block}
.rv-n small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.rv-p{font-weight:600}
.rv-sum{display:grid;gap:4px;margin-top:12px}
.grp h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.req{font-size:11px;font-weight:500;color:var(--crust);background:var(--crust-soft);border-radius:999px;padding:1px 8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13.5px}
.opts button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.opts small{color:var(--crust);font-weight:600;margin-inline-start:4px}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.acts{display:flex;gap:8px;margin-top:18px}
.acts .btn{flex:1}

.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pay button{border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px 6px;font-weight:600}
.pay button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.field{display:grid;gap:4px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);font-size:16px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px}
.change{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--good-soft);color:var(--good);font-weight:700;display:flex;justify-content:space-between}
.change.neg{background:var(--bad-soft);color:var(--bad)}

/* receipt */
.wa{display:grid;gap:6px;margin-top:16px;font-size:13.5px;color:var(--muted)}
.wa-row{display:flex;gap:8px}
.wa-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);font-size:16px;direction:ltr;text-align:right}
.wa-btn{background:#1f7a4a;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.wa-btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.tiny-note{font-size:12px}
.ra{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media print{
  @page{size:80mm auto;margin:2mm}
  body.printing-rcpt{background:#fff!important}
  body.printing-rcpt *{visibility:hidden!important}
  body.printing-rcpt #rcpt,body.printing-rcpt #rcpt *{visibility:visible!important}
  body.printing-rcpt #rcpt{position:fixed;left:0;top:0;width:76mm;max-width:none;margin:0;padding:0;border:0;border-radius:0;font-size:12px;color:#000}
  body.printing-rcpt .scrim{background:none!important;position:static!important}
}

const clone=o=>JSON.parse(JSON.stringify(o));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const deepMerge=(a,b)=>{const r=clone(a);Object.keys(b).forEach(k=>{r[k]=isObj(r[k])&&isObj(b[k])?deepMerge(r[k],b[k]):clone(b[k])});return r};
const wq={};
function queueWrite(path,op){
  if(!DB)return;
  const q=wq[path]||(wq[path]={running:false,next:null});
  if(q.next&&op.op==='update'&&q.next.op!=='del')q.next={op:q.next.op,data:deepMerge(q.next.data,op.data)};else q.next=op;
  if(!q.running)flushWrites(path);
}
async function flushWrites(path){
  const q=wq[path];q.running=true;
  while(q.next){const op=q.next;q.next=null;const ref=DB.doc(path);
    for(let tries=0;tries<2;tries++){try{if(op.op==='del')await ref.delete();else if(op.op==='update')await ref.update(op.data);else await ref.set(op.data);setSync('on');break}
      catch(e){if(e&&e.code==='unavailable'&&tries===0){await new Promise(r=>setTimeout(r,400+Math.random()*600));continue}
        if(e&&(e.code==='invalid_argument'||e.code==='not-found')&&op.op==='update'){/* doc missing: write it whole */const o=S.orders.find(x=>'orders/'+x.id===path);if(o){try{await ref.set(clone(o))}catch(_){}}}
        else setSync(e&&(e.code==='quota_exceeded'||e.code==='resource-exhausted')?'full':'error');break}}}
  q.running=false;
}
function writeOrder(o,partial){save();queueWrite('orders/'+o.id,partial?{op:'update',data:partial}:{op:'set',data:clone(o)})}

function applyMeta(m){

}
const maxNo=()=>S.orders.reduce((m,o)=>Math.max(m,o.no||0),100);
async function nextNo(){
  if(!DB){S.no=Math.max(S.no,maxNo())+1;return S.no}
  if(FDB){try{const ref=FDB.doc('meta/counter');const n=await FDB.runTransaction(async tx=>{const s=await tx.get(ref);const cur=s.exists?((s.data()||{}).no||0):0;const v=Math.max(cur,S.no,maxNo())+1;tx.set(ref,{no:v});return v});S.no=n;return n}catch(e){S.no=Math.max(S.no,maxNo())+1;return S.no}}
  const ref=DB.doc('meta/counter');
  for(let i=0;i<8;i++){
    const r=await ref.acquire({holder:DEV,ttlMs:4000}).catch(()=>({acquired:false}));
    if(r.acquired){try{const s=await ref.get();const cur=s.exists?((s.data()||{}).no||0):0;const n=Math.max(cur,S.no,maxNo())+1;await ref.set({no:n});S.no=n;return n}catch(e){break}}
    await new Promise(res=>setTimeout(res,250+Math.random()*350));
  }
  S.no=Math.max(S.no,maxNo())+1;return S.no;
}

// ---------- Firebase (when the app runs on its own website) ----------
const SHOP_EMAIL='pos@yana.com';
function fbAdapter(fdb){
  const wrap=ref=>({path:ref.path,get:()=>ref.get(),set:d=>ref.set(d),update:d=>ref.update(d),delete:()=>ref.delete(),onSnapshot:(n,e)=>ref.onSnapshot(n,e)});
  return {doc:p=>wrap(fdb.doc(p)),collection:p=>fdb.collection(p)};
}
let fbStarted=false;
function startFirebase(){
  if(!window.firebase){setSync('error');return}
  if(!firebase.apps.length)firebase.initializeApp(window.YANA_FB);
  const fdb=firebase.firestore();
  try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  firebase.auth().onAuthStateChanged(u=>{
    if(u){hideLogin();if(!fbStarted){fbStarted=true;FDB=fdb;startSync(fbAdapter(fdb),800)}}
    else{showLogin()}
  });
}

function startSync(db,orderLimit){
  DB=db;setSync('connecting');
  (async()=>{
  try{
    const ms=await db.doc('meta/state').get();
    if(!ms.exists){await db.doc('meta/state').set(metaBody());for(const o of S.orders){try{await db.doc('orders/'+o.id).set(clone(o))}catch(e){}}}
    else applyMeta(clone(ms.data()));
  }catch(e){DB=null;setSync(FDB?'error':'local');return}
  lastDayOpen=dayOpen();route(true);
  db.doc('meta/state').onSnapshot(s=>{if(!s.exists)return;applyMeta(clone(s.data()));refreshView('meta')},()=>setSync('error'));
  db.doc('meta/counter').onSnapshot(s=>{if(!s.exists)return;const n=(s.data()||{}).no||0;if(n>S.no){S.no=n;save();refreshView('counter')}},()=>{});
  db.collection('orders').orderBy('t','desc').limit(orderLimit).onSnapshot(q=>{
    S.orders=q.docs.map(d=>clone(d.data())).reverse();
    // an order whose stations are all done is ready, whichever device finished last
    S.orders.forEach(o=>{if(o.status==='open'&&o.kds&&Object.keys(o.kds).length&&Object.values(o.kds).every(v=>v==='ready')){o.status='ready';o.readyAt=o.readyAt||Date.now();queueWrite('orders/'+o.id,{op:'update',data:{status:'ready',readyAt:o.readyAt}})}});
    S.no=Math.max(S.no,maxNo());save();setSync('on');refreshView('orders');stationTick();
  },()=>setSync('error'));
  })();
}

const printerCfg=()=>{if(!S.printer)S.printer={ip:'',autoInvoice:false,autoKitchen:false};if(S.printer.barIp==null){S.printer.barIp='';S.printer.autoBar=true}return S.printer};

// turn a canvas into a 1-bit raster 576 dots wide (72mm print area) for ePOS-Print
function rasterB64(src){
  const W=576,H=Math.max(1,Math.round(src.height*W/src.width));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(src,0,0,W,H);
  const d=x.getImageData(0,0,W,H).data,bpr=W/8,out=new Uint8Array(bpr*H);
  for(let y=0;y<H;y++)for(let i=0;i<W;i++){const p=(y*W+i)*4;const a=d[p+3]/255;const lum=(0.299*d[p]+0.587*d[p+1]+0.114*d[p+2])*a+255*(1-a);if(lum<185)out[y*bpr+(i>>3)]|=0x80>>(i&7)}
  let s='';for(let i=0;i<out.length;i+=0x8000)s+=String.fromCharCode.apply(null,out.subarray(i,i+0x8000));
  return {w:W,h:H,b64:btoa(s)};
}
async function eposSend(canvases,ipArg){
  const ip=(ipArg||printerCfg().ip).trim();if(!ip)throw new Error('noip');
  const body=canvases.map(c=>{const r=rasterB64(c);return `<image width="${r.w}" height="${r.h}" color="color_1" mode="mono">${r.b64}</image><feed line="2"/><cut type="feed"/>`}).join('');
  const xml=`<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body><epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">${body}</epos-print></s:Body></s:Envelope>`;
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),15000);
  let res;
  try{res=await fetch(`https://${ip}/cgi-bin/epos/service.cgi?devid=local_printer&timeout=10000`,{method:'POST',headers:{'Content-Type':'text/xml; charset=utf-8','SOAPAction':'""'},body:xml,signal:ctl.signal})}
  catch(e){throw new Error('net')}finally{clearTimeout(tm)}
  const t=await res.text();
  if(!/success="true"/.test(t)){const m=t.match(/code="([^"]*)"/);throw new Error('printer:'+(m?m[1]:res.status))}
}
function printErrText(e){let m=(e&&e.message)||'';const isBar=/\|bar$/.test(m);m=m.replace(/\|bar$/,'');const pre=isBar?L('طابعة البار: ','Bar printer: '):'';return pre+printErrText0(m)}
function printErrText0(m){
  if(m==='noip')return L('اكتب عنوان الطابعة في شاشة المنيو أول.','Enter the printer address on the Menu screen first.');
  if(m==='net')return L('ما قدرنا نوصل للطابعة. تأكد إنها شغّالة وعلى نفس شبكة المحل، وافتح عنوانها مرة في المتصفح ووافق على الشهادة.','Could not reach the printer. Check it is on and on the shop network, then open its address once in the browser and accept the certificate.');
  if(/EPTR_REC_EMPTY/.test(m))return L('ورق الطابعة خلص.','The printer is out of paper.');
  if(/EPTR_COVER_OPEN/.test(m))return L('غطاء الطابعة مفتوح.','The printer cover is open.');
  return L('الطابعة رفضت الطباعة: ','The printer refused the job: ')+m.replace('printer:','');}

function dayCSV(s){

function tlv(fields){const enc=new TextEncoder();const parts=[];fields.forEach((v,i)=>{const b=enc.encode(String(v));parts.push(i+1,b.length,...b)});let s='';parts.forEach(c=>s+=String.fromCharCode(c));return btoa(s)}

async function receiptPdf(el){
  const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff'});
  const w=80,h=canvas.height*w/canvas.width;
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:[w,h+8]});
  pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,4,w,h);
  return pdf.output('blob');
}

  g.onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;const o=S.orders.find(x=>x.id===b.dataset.o);

// ---------- Sales log (by date) ----------
let sy=null,sm='all';
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const MONTHS_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthName=m=>EN()?MONTHS_EN.at(m-1):MONTHS_AR.at(m-1);
const weekday=t=>new Date(t).toLocaleDateString(EN()?'en-GB':'ar-SA-u-ca-gregory-nu-latn',{weekday:'long'});
const hijri=t=>new Date(t).toLocaleDateString(EN()?'en-u-ca-islamic-umalqura-nu-latn':'ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'});
function salesDays(){
  const m={};S.orders.forEach(o=>{const k=dkey(o.t);m[k]=m[k]||{k,t:o.t,n:0,v:0};m[k].n++;m[k].v+=o.total;if(o.t<m[k].t)m[k].t=o.t});
  (S.days||[]).forEach(d=>{const k=dkey(d.startAt);if(!m[k])m[k]={k,t:d.startAt,n:d.count,v:d.total}});
  return Object.values(m).sort((a,b)=>b.k.localeCompare(a.k));
}
function renderSales(){
  const app=document.getElementById('app');
  const days=salesDays();
  const years=[...new Set(days.map(d=>+d.k.slice(0,4)))];if(!years.length)years.push(new Date().getFullYear());
  if(sy===null||!years.includes(sy))sy=years[0];
  const inYear=days.filter(d=>+d.k.slice(0,4)===sy);
  const months=[...new Set(inYear.map(d=>+d.k.slice(5,7)))];
  const shown=inYear.filter(d=>sm==='all'||+d.k.slice(5,7)===+sm);
  const byMonth=months.map(mm=>({mm,days:shown.filter(d=>+d.k.slice(5,7)===mm)})).filter(x=>x.days.length);
  const yTot=inYear.reduce((s,d)=>s+d.v,0),yN=inYear.reduce((s,d)=>s+d.n,0);
  const sTot=shown.reduce((s,d)=>s+d.v,0),sN=shown.reduce((s,d)=>s+d.n,0);
  app.innerHTML=`<h2>${L('سجل المبيعات','Sales log')}</h2><p class="sub">${L('مبيعات كل يوم محفوظة بالتاريخ. اضغط على أي يوم لتقريره المفصّل.','Every day\'s sales saved by date. Tap a day for its detailed report.')}</p>
   <div class="panel" style="margin-bottom:16px"><div class="toolbar" style="margin:0">
     <label for="sy" style="font-size:13.5px;color:var(--muted)">${L('السنة','Year')}</label><select id="sy">${years.map(y=>`<option value="${y}" ${y===sy?'selected':''}>${y}</option>`).join('')}</select>
     <label for="sm" style="font-size:13.5px;color:var(--muted)">${L('الشهر','Month')}</label><select id="sm"><option value="all">${L('كل الشهور','All months')}</option>${months.map(mm=>`<option value="${mm}" ${String(mm)===String(sm)?'selected':''}>${monthName(mm)}</option>`).join('')}</select>
     <button class="btn ghost sm" id="sxls" style="margin-inline-start:auto">${L('حفظ Excel','Save Excel')}</button>
   </div><p class="note" id="snote" style="margin:6px 0 0"></p></div>
   <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
     <div class="kpi"><span>${sm==='all'?L('مبيعات سنة ','Sales in ')+sy:L('مبيعات ','Sales in ')+monthName(+sm)+' '+sy}</span><b class="num">${fmt0(sTot)}<small>${CUR()}</small></b></div>
     <div class="kpi"><span>${L('عدد الطلبات','Orders')}</span><b class="num">${sN}</b></div>
     <div class="kpi"><span>${L('متوسط اليوم','Daily average')}</span><b class="num">${fmt0(shown.length?sTot/shown.length:0)}<small>${CUR()}</small></b></div>
   </div>
   ${byMonth.length?byMonth.map(({mm,days})=>{const t=days.reduce((s,d)=>s+d.v,0),n=days.reduce((s,d)=>s+d.n,0);return `<div class="panel" style="margin-bottom:14px;padding:0">
     <div class="mhead"><b>${monthName(mm)} <span class="num">${sy}</span></b><span><span class="num">${days.length}</span> ${L('يوم','days')} · <span class="num">${n}</span> ${L('طلب','orders')} · <b class="num">${fmt(t)}</b> ${CUR()}</span></div>
     <div class="tscroll"><table class="sheet-t saletab"><thead><tr><th>${L('اليوم','Day')}</th><th>${L('التاريخ','Date')}</th><th>${L('الهجري','Hijri')}</th><th>${L('الطلبات','Orders')}</th><th>${L('المبيعات','Sales')}</th><th>${L('الضريبة','VAT')}</th></tr></thead><tbody>
     ${days.map(d=>`<tr data-sd="${d.k}" tabindex="0"><td>${weekday(d.t)}</td><td class="num">${d.k.slice(8,10)}/${d.k.slice(5,7)}/${d.k.slice(0,4)}</td><td style="color:var(--muted)">${hijri(d.t)}</td><td class="num">${d.n}</td><td class="num"><b>${fmt(d.v)}</b></td><td class="num">${fmt(d.v*15/115)}</td></tr>`).join('')}
     </tbody></table></div></div>`}).join(''):`<div class="panel"><p class="empty">${L('ما فيه مبيعات محفوظة بعد. أول ما ترسل طلبات، تظهر هنا مرتبة بالتاريخ.','No saved sales yet. Once orders are sent, they appear here by date.')}</p></div>`}
   ${sm==='all'&&inYear.length?`<p class="sub" style="text-align:end">${L('إجمالي سنة','Total for')} <span class="num">${sy}</span>: <b class="num">${fmt(yTot)}</b> ${CUR()} · <span class="num">${yN}</span> ${L('طلب','orders')}</p>`:''}`;
  document.getElementById('sy').onchange=e=>{sy=+e.target.value;sm='all';renderSales()};
  document.getElementById('sm').onchange=e=>{sm=e.target.value;renderSales()};
  document.getElementById('sxls').onclick=async()=>{const note=document.getElementById('snote');
    try{
      const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
      const rows=[[L('اليوم','Day'),L('التاريخ','Date'),L('الهجري','Hijri'),L('الطلبات','Orders'),L('المبيعات','Sales'),L('الضريبة','VAT')]].concat(shown.slice().reverse().map(d=>[weekday(d.t),d.k.slice(8,10)+'/'+d.k.slice(5,7)+'/'+d.k.slice(0,4),hijri(d.t),d.n,d.v.toFixed(2),(d.v*15/115).toFixed(2)]));
      rows.push([L('الإجمالي','Total'),'','',sN,sTot.toFixed(2),(sTot*15/115).toFixed(2)]);
      await saveFile('yana-sales-'+sy+(sm==='all'?'':'-'+String(sm).padStart(2,'0'))+'.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'));toast(L('تم حفظ الملف','File saved'))}
    catch(err){note.textContent=err&&err.code==='declined'?L('تم إلغاء الحفظ.','Save cancelled.'):L('ما قدرنا نحفظ الملف، حاول مرة ثانية.','Could not save the file. Try again.')}};
  const openDay=k=>{const [y,mo,dd]=k.split('-').map(Number);const from=new Date(y,mo-1,dd).getTime(),to=new Date(y,mo-1,dd+1).getTime();const s=daySummary(from,to);s.to=Math.min(to-1,Date.now());const Ly=document.getElementById('layer');
    Ly.innerHTML=`<div class="scrim" id="scrim"><div class="sheet wide" role="dialog" aria-modal="true"><div class="sheet-top">${backBtn('sdback')}</div><div id="dsumbox" class="printbox"><h3>${weekday(from)} <span class="num">${dd}/${mo}/${y}</span> · ${L(SELLER.shopAr,SELLER.shopEn)}</h3><p class="sub" style="margin:2px 0 0">${hijri(from)}</p>${summaryHTML(s)}</div>${reportButtons()}</div></div>`;
    wireReport(s);Ly.onclick=ev=>{if(ev.target.id==='scrim'||ev.target.closest('#sdback'))Ly.innerHTML=''}};
  app.onclick=e=>{const r=e.target.closest('[data-sd]');if(r)openDay(r.dataset.sd)};
  app.onkeydown=e=>{const r=e.target.closest('[data-sd]');if(r&&e.key==='Enter')openDay(r.dataset.sd)};
}

   <h3 style="margin:0 0 10px;font-size:15px">${L('الويتر وأرقام الدخول','Waiters and sign-in codes')}</h3>

     <label for="mgrpin" style="font-size:13.5px;color:var(--muted);margin-inline-start:auto">${L('رقم المدير','Manager code')}</label><input id="mgrpin" class="num" inputmode="numeric" maxlength="4" value="${esc(staff().managerPin)}" style="width:90px"></div>
  </div>`;
  const validPin=p=>/^[0-9]{4}$/.test(p);
  app.onchange=e=>{const t=e.target;
    if(t.dataset.wn){const w=staff().waiters.find(x=>x.id===t.dataset.wn);const v=t.value.trim();if(v){w.name=v;saveMeta();toast(L('تم حفظ الاسم','Name saved'))}else t.value=w.name}
    if(t.dataset.sn){const w=staff().supervisors.find(x=>x.id===t.dataset.sn);const v=t.value.trim();if(v){w.name=v;saveMeta();toast(L('تم حفظ الاسم','Name saved'))}else t.value=w.name}
    const pinEdit=(w)=>{const v=t.value.trim();
      if(!validPin(v)){toast(L('رقم الدخول لازم 4 أرقام','The code must be 4 digits'));t.value=w.pin;return}
      if(v!==w.pin&&allPins().includes(v)){toast(L('هذا الرقم مستخدم','This code is already used'));t.value=w.pin;return}
      w.pin=v;saveMeta();toast(L('تم حفظ رقم الدخول','Code saved'))};
    if(t.dataset.wp)pinEdit(staff().waiters.find(x=>x.id===t.dataset.wp));
    if(t.dataset.sp)pinEdit(staff().supervisors.find(x=>x.id===t.dataset.sp));
    if(t.id==='mgrpin'){const v=t.value.trim();if(!validPin(v)||(v!==staff().managerPin&&allPins().includes(v))){toast(L('رقم المدير لازم 4 أرقام وما يتكرر','Manager code must be 4 unique digits'));t.value=staff().managerPin;return}staff().managerPin=v;saveMeta();toast(L('تم حفظ رقم المدير','Manager code saved'))}
  };
  const freePin=()=>{const used=new Set(allPins());let p;do{p=String(1000+Math.floor(Math.random()*9000))}while(used.has(p));return p};
  document.getElementById('sadd').onclick=()=>{staff().supervisors.push({id:'s'+Date.now(),name:L('مشرف جديد','New supervisor'),pin:freePin()});saveMeta();renderStaff()};

  app.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{if(staff().waiters.length<=1){toast(L('لازم يبقى ويتر واحد على الأقل','Keep at least one waiter'));return}staff().waiters=staff().waiters.filter(w=>w.id!==b.dataset.wdel);saveMeta();renderStaff()});
}

     <label>${L('التصنيف','Category')}<select id="ac">${CATS.map(c=>`<option value="${c.id}">${L(c.n,c.en)}</option>`).join('')}</select></label>

     <label>${L('السعرات','kcal')}<input id="ak" type="number" min="0"></label>
     <button class="btn" type="submit">${L('إضافة','Add')}</button>
   </form>
  </div>`;
  const keepFocus=(id,fn)=>{const pos=document.getElementById(id).selectionStart;fn();const n=document.getElementById(id);n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
  document.getElementById('mq').oninput=e=>{mq=e.target.value;keepFocus('mq',renderMenu)};
  const fo=document.getElementById('fbout');if(fo)fo.onclick=()=>{firebase.auth().signOut();toast(L('تم تسجيل الخروج','Signed out'))};
  const prip=document.getElementById('prip');
  if(prip){prip.onchange=()=>{printerCfg().ip=prip.value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');saveMeta();toast(L('تم حفظ عنوان الطابعة','Printer address saved'));renderMenu()};
    document.getElementById('prinv').onchange=e=>{printerCfg().autoInvoice=e.target.checked;saveMeta()};
    document.getElementById('prkit').onchange=e=>{printerCfg().autoKitchen=e.target.checked;saveMeta()};
    const cleanIp=v=>v.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
    document.getElementById('prbip').onchange=e=>{printerCfg().barIp=cleanIp(e.target.value);saveMeta();toast(L('تم حفظ عنوان طابعة البار','Bar printer address saved'));renderMenu()};
    document.getElementById('prbar').onchange=e=>{printerCfg().autoBar=e.target.checked;saveMeta()};
    document.getElementById('prst').onchange=e=>{printerCfg().station=e.target.checked;saveMeta();applyStationBadge();renderMenu()};
    const pm=document.getElementById('prme');if(pm)pm.onclick=()=>{IS_STATION=!IS_STATION;try{localStorage.setItem('yana-printstation',IS_STATION?'1':'0')}catch(e){}if(IS_STATION){keepAwake();stationTick()}applyStationBadge();renderMenu()};
    document.getElementById('prbtest').onclick=async e=>{const b=e.currentTarget;b.disabled=true;
      const box=document.createElement('div');box.style.cssText='position:fixed;left:-10000px;top:0;width:380px;background:#fff;color:#000;padding:12px;text-align:center;font:700 26px/1.5 Tahoma,sans-serif';
      box.innerHTML=`<div style="font-size:40px">${L('البار','BAR')}</div><div>${L('تجربة طابعة البار ✓','Bar printer test ✓')}</div><div style="font-size:18px">${new Date().toLocaleString('en-GB')}</div>`;document.body.appendChild(box);
      try{if(!printerCfg().barIp)throw new Error('noip');const c=await canvasOf(box);await eposSend([c],printerCfg().barIp);toast(L('طابعة البار شغّالة ✓','Bar printer works ✓'))}catch(err){toast(L('طابعة البار: ','Bar printer: ')+printErrText0(err.message||''))}finally{box.remove();b.disabled=false}};
    document.getElementById('prtest').onclick=async e=>{const b=e.currentTarget;b.disabled=true;
      const box=document.createElement('div');box.style.cssText='position:fixed;left:-10000px;top:0;width:380px;background:#fff;color:#000;padding:12px;text-align:center;font:700 26px/1.5 Tahoma,sans-serif';
      box.innerHTML=`<div style="font-size:40px">${L(SELLER.shopAr,SELLER.shopEn)}</div><div>${L('تجربة الطابعة ✓','Printer test ✓')}</div><div style="font-size:18px">${new Date().toLocaleString('en-GB')}</div>`;document.body.appendChild(box);
      try{const c=await canvasOf(box);await eposSend([c]);toast(L('الطابعة شغّالة ✓','Printer works ✓'))}catch(err){toast(printErrText(err))}finally{box.remove();b.disabled=false}}}
  document.getElementById('tcount').onchange=e=>{S.tables=Math.min(60,Math.max(1,parseInt(e.target.value)||30));e.target.value=S.tables;saveMeta();toast(L('تم تحديث عدد الطاولات','Table count updated'))};
  document.getElementById('mcat').onchange=e=>{mcat=e.target.value;renderMenu()};
  app.onchange=e=>{const p=e.target.dataset.p,s=e.target.dataset.s;
    if(p){const it=allItems().find(x=>x.id===p);it.price=Math.max(0,parseFloat(e.target.value)||0);saveMeta();toast(L('تم تحديث سعر ','Price updated: ')+nm(it))}
    };
  app.onclick=e=>{const b=e.target.closest('[data-sw]');if(!b)return;const it=allItems().find(x=>x.id===b.dataset.sw);
    if(S.items.includes(it))S.off[it.id]=!S.off[it.id];else it.off=!it.off;saveMeta();b.setAttribute('aria-checked',String(!off(it)))};
  document.getElementById('addf').onsubmit=e=>{e.preventDefault();
    const c=document.getElementById('ac').value,cd=CATS.find(x=>x.id===c);const k=parseInt(document.getElementById('ak').value)||null;
    const st=cd.st==='mix'?(k?'k':'v'):cd.st;
    const it={id:'c-'+Date.now(),cat:c,name:document.getElementById('an').value.trim(),price:parseFloat(document.getElementById('ap').value)||0,kcal:k,st};
    if(!it.name)return;S.custom.push(it);saveMeta();toast(L('انضاف ','Added ')+it.name);renderMenu()};
}

// ---------- Reports ----------
function renderReports(){
  const app=document.getElementById('app');
  const mid=new Date();mid.setHours(0,0,0,0);
  const orders=S.orders.filter(o=>o.t>=mid.getTime());
  const sales=orders.reduce((s,o)=>s+o.total,0),vat=sales*15/115,n=orders.length;
  const ch={};orders.forEach(o=>{const k=o.type in TYPES?o.type:'out';ch[k]=ch[k]||{n:0,v:0};ch[k].n++;ch[k].v+=o.total});
  const chArr=Object.entries(ch).sort((a,b)=>b[1].v-a[1].v);const chmax=chArr[0]?chArr[0][1].v:1;
  const appShare=sales?orders.filter(o=>isApp(o.type)).reduce((s,o)=>s+o.total,0)/sales*100:0;
  const hours=Array.from({length:18},(_,i)=>i+6).map(h=>({h,v:orders.filter(o=>new Date(o.t).getHours()===h).reduce((s,o)=>s+o.total,0)}));
  const items={};orders.forEach(o=>o.lines.forEach(l=>{items[l.id]=items[l.id]||{l,q:0};items[l.id].q+=l.qty}));
  const top=Object.values(items).sort((a,b)=>b.q-a.q).slice(0,8);
  const cats={};orders.forEach(o=>o.lines.forEach(l=>{cats[l.cat]=(cats[l.cat]||0)+l.unit*l.qty}));
  const catArr=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6);const cmax=catArr[0]?catArr[0][1]:1;
  const W=640,H=220,pl=44,pr=8,pt=16,pb=28,max=Math.max(1,...hours.map(x=>x.v));const step=max>600?200:max>300?100:50;const top_=Math.ceil(max/step)*step;
  const bw=(W-pl-pr)/hours.length,y=v=>pt+(H-pt-pb)*(1-v/top_);
  const peak=hours.reduce((a,b)=>b.v>a.v?b:a,hours[0]);
  const ticks=[];for(let v=0;v<=top_;v+=step)ticks.push(v);
  const xOf=i=>EN()?pl+i*bw:W-pr-(i+1)*bw; // hours read right-to-left in Arabic
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('المبيعات حسب الساعة','Sales by hour')}">
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${v}</text>`).join('')}
    ${hours.map((x,i)=>`<rect x="${xOf(i)+3}" y="${y(x.v)}" width="${bw-6}" height="${Math.max(0,H-pb-y(x.v))}" rx="3" fill="${x===peak&&x.v?'var(--crust)':'var(--brand)'}" opacity="${x===peak?1:.75}"><title>${x.h}:00 — ${fmt0(x.v)} ${CUR()}</title></rect>${i%2===0?`<text x="${xOf(i)+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${x.h}</text>`:''}`).join('')}
  </svg>`;
  app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><h2>${L('تقرير اليوم','Today\'s report')}</h2><p class="sub">${new Date().toLocaleDateString(EN()?'en-GB':'ar-SA-u-nu-latn',{weekday:'long',day:'numeric',month:'long'})}</p></div><button class="btn ghost sm" id="reset">${L('مسح كل الطلبات','Delete all orders')}</button></div>
   <div class="kpis">
     <div class="kpi"><span>${L('المبيعات شامل الضريبة','Sales incl. VAT')}</span><b class="num">${fmt0(sales)}<small>${CUR()}</small></b></div>
     <div class="kpi"><span>${L('عدد الطلبات','Orders')}</span><b class="num">${n}</b></div>
     <div class="kpi"><span>${L('متوسط الفاتورة','Average ticket')}</span><b class="num">${fmt(n?sales/n:0)}<small>${CUR()}</small></b></div>
     <div class="kpi"><span>${L('ضريبة القيمة المضافة','VAT')}</span><b class="num">${fmt(vat)}<small>${CUR()}</small></b></div>
   </div>
   <div class="rgrid">
     <div class="stack">
       <div class="panel chart"><h3>${L('المبيعات حسب الساعة (ر.س)','Sales by hour (SAR)')}${peak.v?` · ${L('الذروة الساعة','Peak at')} <span class="num">${peak.h}:00</span>`:''}</h3>${svg}</div>
       <div class="panel"><h3>${L('المبيعات حسب التصنيف','Sales by category')}</h3><div class="bars">${catArr.map(([c,v],i)=>`<div class="b"><span>${catName(c)}</span><span class="track"><span class="fill ${i===0?'c':''}" style="width:${v/cmax*100}%;display:block"></span></span><span class="num">${fmt0(v)}</span></div>`).join('')}</div></div>
     </div>
     <div class="stack">
       <div class="panel"><h3>${L('المبيعات حسب نوع الطلب','Sales by order type')}</h3><p class="sub" style="margin:-6px 0 12px">${L('تطبيقات التوصيل','Delivery apps')}: <span class="num">${Math.round(appShare)}%</span> ${L('من المبيعات','of sales')}</p><div class="bars">${chArr.map(([k,x])=>`<div class="b"><span>${typ(k)} <small class="num" style="color:var(--muted)">(${x.n})</small></span><span class="track"><span class="fill ${isApp(k)?'c':''}" style="width:${x.v/chmax*100}%;display:block"></span></span><span class="num">${fmt0(x.v)}</span></div>`).join('')}</div></div>
       <div class="panel"><h3>${L('الأكثر مبيعاً','Best sellers')}</h3><ol class="toplist">${top.map(x=>`<li>${esc(nm(x.l))}<span><span class="num">${x.q}</span> ${L('قطعة','pcs')}</span></li>`).join('')||`<li>${L('لا مبيعات بعد','No sales yet')}</li>`}</ol></div>
       <div class="panel"><h3>${L('سجل الأيام','Day log')}</h3><ul class="daylog">${(S.days||[]).slice(0,14).map((d,i)=>`<li><button data-day="${i}"><span class="num">${dmy(d.startAt)}</span><span class="num">${hm(d.startAt)}–${hm(d.endAt)}</span><span><span class="num">${d.count}</span> ${L('طلب','orders')}</span><b class="num">${fmt0(d.total)}</b></button></li>`).join('')||`<li class="empty" style="padding:8px 0">${L('ما فيه أيام مغلقة بعد.','No closed days yet.')}</li>`}</ul></div>
     </div>
   </div>`;
  app.onclick=e=>{const b=e.target.closest('[data-day]');if(!b)return;const d=S.days[+b.dataset.day];const s=daySummary(d.startAt,d.endAt+1);const Ly=document.getElementById('layer');
    Ly.innerHTML=`<div class="scrim" id="scrim"><div class="sheet wide" role="dialog" aria-modal="true"><div class="sheet-top">${backBtn('dlback')}</div><div id="dsumbox" class="printbox"><h3>${L('تقرير اليوم','Day report')} · ${L(SELLER.shopAr,SELLER.shopEn)}</h3>${summaryHTML(s)}</div>${reportButtons()}</div></div>`;
    wireReport(s);
    Ly.onclick=ev=>{if(ev.target.id==='scrim'||ev.target.closest('#dlback'))Ly.innerHTML=''}};
  document.getElementById('reset').onclick=()=>{const Ly=document.getElementById('layer');
    Ly.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><h3>${L('مسح كل الطلبات؟','Delete all orders?')}</h3><p class="sub" style="margin-top:8px">${L('بينمسح كل الطلبات والفواتير وسجل الأيام من هذا الجهاز، وما تقدر ترجعها. المنيو والأسعار والمخزون ما تتأثر.','All orders, invoices and the day log on this device will be deleted and cannot be restored. Menu, prices and stock stay.')}</p><div class="acts"><button class="btn ghost" id="rsno">${L('إلغاء','Cancel')}</button><button class="btn" id="rsyes" style="background:var(--bad);color:#fff">${L('نعم، امسح','Yes, delete')}</button></div></div></div>`;
    Ly.onclick=e=>{if(e.target.id==='scrim'||e.target.closest('#rsno')){Ly.innerHTML='';return}if(e.target.closest('#rsyes')){S.orders.forEach(o=>queueWrite('orders/'+o.id,{op:'del'}));S.orders=[];S.days=[];if(dayOpen())S.day.startAt=Date.now();saveMeta();cart=[];Ly.innerHTML='';toast(L('تم مسح كل الطلبات','All orders deleted'));renderReports();updateBadge()}}};
}

// ---------- chrome + router ----------
function applyLang(){
  const h=document.documentElement;h.lang=LANG;h.dir=EN()?'ltr':'rtl';
  document.title=L('يانا كاشير','Yana POS');
  document.getElementById('n-pos').textContent=L('الكاشير','Cashier');
  document.getElementById('n-kitchen').textContent=L('المطبخ','Kitchen');
  document.getElementById('n-menu').textContent=L('المنيو','Menu');
  document.getElementById('n-bar').textContent=L('البار','Bar');
  document.getElementById('n-tables').textContent=L('الطاولات','Tables');
  document.getElementById('n-ready').textContent=L('الطلبات الجاهزة','Ready orders');
  document.getElementById('n-sales').textContent=L('سجل المبيعات','Sales log');
  document.getElementById('n-invoices').textContent=L('الفواتير','Invoices');
  document.getElementById('n-reports').textContent=L('التقارير','Reports');
  setSync(SYNC);applyRole();applyStationBadge();
  const b=document.getElementById('langbtn');
  b.textContent=EN()?'العربية':'English';b.lang=EN()?'ar':'en';
  b.setAttribute('aria-label',EN()?'التبديل إلى العربية':'Switch to English');
}
document.getElementById('langbtn').onclick=()=>{LANG=EN()?'ar':'en';try{localStorage.setItem('yana-lang',LANG)}catch(e){}applyLang();route(true)};
const VIEWS={tables:renderTables,sales:renderSales,pos:renderPOS,kitchen:renderKitchen,bar:renderBar,ready:renderReady,invoices:renderInvoices,menu:renderMenu,reports:renderReports};
function route(keepScroll){
  let v=(location.hash||'#pos').slice(1);
  applyRole();
  if(isWaiterMode()){
    document.getElementById('layer').innerHTML='';document.getElementById('app').onclick=null;document.getElementById('app').onchange=null;
    if(!curWaiter()){renderWaiterLogin();document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current','false'));return}
    if(!WAITER_VIEWS.includes(v)){v='pos';if(location.hash!=='#pos'){history.replaceState(null,'','#pos')}}
  }
  const view=VIEWS[v]?v:'pos';
  document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+view?'page':'false'));
  document.getElementById('layer').innerHTML='';document.getElementById('app').onclick=null;document.getElementById('app').onchange=null;
  VIEWS[view]();updateBadge();if(keepScroll!==true)window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>route());
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const b=document.querySelector('#layer .backbtn');if(b){b.click();return}if(ticketOpen){ticketOpen=false;drawTicket()}});
fixManagerPin();keepAwake();
applyLang();
route();
setSync('local');connectDB();
</script>
